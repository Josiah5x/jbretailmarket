<nav class="navbar navbar-expand-lg border-bottom sticky-top main-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/">
            MiniStore
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <!-- Navigation -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/shop/">Shop</a>
                </li>
            </ul>

            <!-- Search -->
            <form class="d-flex me-lg-3 my-2 my-lg-0" method="get" action="{% url 'catalog:product_list' %}">
                <div class="input-group">
                    <input type="search" name="q" value="{{ request.GET.q|default:'' }}" class="form-control" placeholder="Search products..." aria-label="Search products">
                    <button class="btn btn-theme-primary" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

            <!-- Actions Container (Account, Cart, Theme Toggle) -->
            <div class="d-flex align-items-center gap-2">
                <!-- Account -->
                {% if user.is_authenticated %}
                    <a href="#" class="btn btn-theme-secondary">
                        <i class="bi bi-person"></i>
                    </a>
                {% else %}
                    <a href="#" class="btn btn-outline-theme">
                        Login
                    </a>
                {% endif %}

                <!-- Cart -->
                <a href="{% url 'cart:detail' %}" class="btn btn-theme-secondary position-relative me-2">
                    <i class="bi bi-cart3"></i>
                    <span class="d-none d-md-inline ms-1">Cart</span>
                    {% if cart_item_count %}
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-count">
                            {{ cart_item_count }}
                        </span>
                    {% endif %}
                </a>

                <!-- Theme Toggle Button (Using Bootstrap Icons matching your project) -->
                <button id="theme-toggle" class="btn btn-theme-secondary" aria-label="Toggle theme">
                    <i id="theme-toggle-icon" class="bi bi-moon-stars"></i>
                </button>
            </div>
        </div>
    </div>
</nav>
